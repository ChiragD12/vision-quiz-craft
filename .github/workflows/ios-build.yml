name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - capacitor-ios

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: |
          cd ios/App
          pod install

      - run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            build

      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/App/build
